<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secret Hitler — Table Records{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
  <script>
    // htmx drops 4xx responses by default, but a rejected game (422) and the
    // admin guard (403) answer with fragments meant to be shown: the error
    // notice above the form, still filled in.
    document.addEventListener("htmx:beforeSwap", function (e) {
      var status = e.detail.xhr.status;
      if (status === 422 || status === 403) {
        e.detail.shouldSwap = true;
        e.detail.isError = false;
      }
    });
  </script>
</head>
<body>
  <div class="shell">
    <div class="deco-frame">
      <header class="masthead">
        <div class="adminbar">
          {% if is_admin %}
            <span class="admin-badge">◆ Admin</span>
            <a class="admin-link" href="{{ url_for('auth.logout') }}">Sign out</a>
          {% else %}
            <a class="admin-link" href="{{ url_for('auth.login') }}">Admin sign-in</a>
          {% endif %}
        </div>
        <p class="eyebrow">Game Night Records</p>
        <h1><a href="{{ url_for('public.index') }}" style="color:inherit">Secret Hitler</a></h1>
        <div class="rule"><span class="dot"></span></div>
        <p class="sub">Leaderboard &amp; Chronicle</p>
        <nav class="deconav">
          <a href="{{ url_for('public.index') }}"
             class="{{ 'on' if request.endpoint == 'public.index' }}">Standings</a>
          <span class="sep">◆</span>
          <a href="{{ url_for('public.dashboard') }}"
             class="{{ 'on' if request.endpoint == 'public.dashboard' }}">Dashboard</a>
          <span class="sep">◆</span>
          <a href="{{ url_for('public.search') }}"
             class="{{ 'on' if request.endpoint == 'public.search' }}">Search</a>
        </nav>
      </header>
      {% block body %}{% endblock %}
      <div class="footer">Enact wisely · Trust no one</div>
    </div>
  </div>
</body>
</html>
