<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Secret Hitler — Table Records{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <script src="{{ url_for('static', filename='js/htmx.min.js') }}"></script>
</head>
<body>
  <div class="shell">
    <div class="deco-frame">
      <header class="masthead">
        <div class="adminbar">
          {% if is_admin %}
            <span class="admin-badge">◆ Admin</span>
            <a class="admin-link" href="{{ url_for('logout') }}">Sign out</a>
          {% else %}
            <a class="admin-link" href="{{ url_for('login') }}">Admin sign-in</a>
          {% endif %}
        </div>
        <p class="eyebrow">Game Night Records</p>
        <h1><a href="{{ url_for('index') }}" style="color:inherit">Secret Hitler</a></h1>
        <div class="rule"><span class="dot"></span></div>
        <p class="sub">Leaderboard &amp; Chronicle</p>
      </header>
      {% block body %}{% endblock %}
      <div class="footer">Enact wisely · Trust no one</div>
    </div>
  </div>
</body>
</html>
